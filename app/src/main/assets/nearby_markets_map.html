<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mercados próximos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <style>
    html, body { margin:0; padding:0; height:100%; font-family:sans-serif; background:#F6F4FA; }
    #map { width:100%; height:100%; background:#E9E4F7; }
    #overlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(246,244,250,0.88); color:#4F378B; font-size:14px; z-index:999;
      text-align:center; padding:20px; transition:opacity .2s ease;
    }
    #overlay.hidden { opacity:0; pointer-events:none; }
    .leaflet-control-attribution { font-size:10px; }
    .market-popup { min-width:210px; font-family:sans-serif; }
    .market-popup h3 { margin:0 0 5px; font-size:15px; }
    .market-popup p { margin:3px 0; font-size:12px; color:#555; }
    .market-popup .origin { margin-bottom:8px; color:#6c6c6c; }
    .market-popup .kind {
      display:inline-block; margin:0 0 10px; padding:4px 10px; border-radius:999px;
      background:#EEE7FF; color:#4F378B; font-size:12px; font-weight:600;
    }
    .market-popup button {
      border:none; border-radius:16px; padding:10px 14px; font-weight:600;
      margin-top:8px; margin-right:8px; cursor:pointer;
    }
    .market-popup .primary { background:#6E45E2; color:#fff; }
    .market-popup .secondary { background:#EFE7FF; color:#4F378B; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="overlay">Carregando mapa…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
  window.appMap = L.map('map', { zoomControl:true, preferCanvas:true }).setView([-14.2350, -51.9253], 4);
  const map = window.appMap;
  const tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let userMarker = null;
  window.marketLayer = L.layerGroup().addTo(map);
  const marketLayer = window.marketLayer;
  const overlay = document.getElementById('overlay');

  function setMapState(message, loading) {
    overlay.textContent = message || '';
    if (loading) {
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  function refreshMapLayout() {
    setTimeout(function() { map.invalidateSize(true); }, 80);
  }

  tileLayer.on('load', refreshMapLayout);
  tileLayer.on('tileerror', function() {
    overlay.textContent = 'Falha ao carregar partes do mapa. Puxe para atualizar ou tente novamente.';
    overlay.classList.remove('hidden');
  });

  window.addEventListener('resize', refreshMapLayout);
  document.addEventListener('DOMContentLoaded', refreshMapLayout);

  function setUserLocation(lat, lon) {
    if (userMarker) {
      userMarker.setLatLng([lat, lon]);
    } else {
      userMarker = L.circleMarker([lat, lon], {
        radius: 8,
        color: '#4F378B',
        weight: 3,
        fillColor: '#F4EDFF',
        fillOpacity: 1
      }).addTo(map).bindPopup('Você está aqui');
    }
    map.setView([lat, lon], Math.max(map.getZoom(), 13));
    refreshMapLayout();
  }

  function markerColor(kind) {
    if (!kind) return '#6E45E2';
    const text = kind.toLowerCase();
    if (text.includes('hort')) return '#2E7D32';
    if (text.includes('atacad')) return '#EF6C00';
    if (text.includes('conveni')) return '#0277BD';
    if (text.includes('feira')) return '#7B1FA2';
    return '#6E45E2';
  }

  function renderMarkets(markets) {
    marketLayer.clearLayers();
    const bounds = [];

    if (!markets || markets.length === 0) {
      overlay.textContent = 'Nenhum mercado encontrado para o raio atual.';
      overlay.classList.remove('hidden');
      refreshMapLayout();
      return;
    }

    overlay.classList.add('hidden');

    markets.forEach(function(m) {
      const marker = L.circleMarker([m.lat, m.lon], {
        radius: m.favorite ? 10 : 8,
        color: m.favorite ? '#4F378B' : '#5C5F64',
        weight: m.favorite ? 3 : 2,
        fillColor: markerColor(m.kind),
        fillOpacity: 0.95
      }).addTo(marketLayer);

      const popup = document.createElement('div');
      popup.className = 'market-popup';

      const title = document.createElement('h3');
      title.textContent = m.name;
      popup.appendChild(title);

      const kind = document.createElement('div');
      kind.className = 'kind';
      kind.textContent = m.kind || 'Mercado';
      popup.appendChild(kind);

      const distance = document.createElement('p');
      distance.textContent = m.distanceMeters < 1000
        ? Math.max(0, Math.round(m.distanceMeters)) + ' m'
        : (m.distanceMeters / 1000).toFixed(1).replace('.', ',') + ' km';
      popup.appendChild(distance);

      if (m.address) {
        const address = document.createElement('p');
        address.textContent = m.address;
        popup.appendChild(address);
      }

      const origin = document.createElement('p');
      origin.className = 'origin';
      origin.textContent = m.fromCache ? 'Origem: cache recente' : 'Origem: OpenStreetMap / Overpass';
      popup.appendChild(origin);

      const listButton = document.createElement('button');
      listButton.className = 'primary';
      listButton.textContent = m.hasList ? 'Abrir lista deste mercado' : 'Criar lista';
      listButton.onclick = function() { AndroidMarket.listAction(m.key); };
      popup.appendChild(listButton);

      const favoriteButton = document.createElement('button');
      favoriteButton.className = 'secondary';
      favoriteButton.textContent = m.favorite ? 'Remover dos favoritos' : 'Favoritar';
      favoriteButton.onclick = function() { AndroidMarket.toggleFavorite(m.key); };
      popup.appendChild(favoriteButton);

      marker.bindPopup(popup);
      bounds.push([m.lat, m.lon]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 15);
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding:[24,24], maxZoom:15 });
    }
    refreshMapLayout();
  }
</script>
</body>
</html>
