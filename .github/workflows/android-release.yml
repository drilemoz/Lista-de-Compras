name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: lista-de-compras-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy Android CI workflow
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          LEGACY=".github/workflows/android.yml"
          if [ ! -f "$LEGACY" ]; then
            echo "Legacy Android CI workflow already absent."
            exit 0
          fi

          echo "Removing legacy workflow: $LEGACY"
          rm -f "$LEGACY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u "$LEGACY"

          if git diff --cached --quiet; then
            echo "No cleanup commit required."
            exit 0
          fi

          git commit -m "Remove legacy Android CI workflow [skip ci]"
          git push origin HEAD:main

      - name: Validate source and version
        run: |
          python3 scripts/validate_version.py
          python3 scripts/validate_branding.py
          python3 scripts/validate_categories_and_identity.py
          python3 scripts/validate_price_split_and_ui.py
          python3 scripts/validate_shopping_mode.py
          python3 scripts/validate_product_details_photos.py
          python3 scripts/validate_source.py
          python3 scripts/validate_workflow.py
          python3 scripts/validate_repaginacao.py
          python3 scripts/validate_ui_restyle.py
          python3 scripts/validate_resource_styles.py
          python3 scripts/validate_purchase_catalog.py
          python3 scripts/validate_final.py
          python3 scripts/validate_location_lint.py
          python3 scripts/validate_lint_build25.py
          python3 scripts/validate_lint_build26.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate signing fallback and credential isolation
        run: python3 scripts/test_signing_workflow.py

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests, Debug build and Android Lint
        shell: bash
        run: |
          set -euo pipefail
          # Se o Lint falhar, exponha todos os erros no log (Gradle exibe apenas o primeiro).
          if ! gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace; then
            REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$REPORT" ]; then
              echo "::group::Relatório Android Lint - erros completos"
              grep -n -B 1 -A 4 -E ': Error: |^[0-9]+ errors' "$REPORT" || true
              echo "::endgroup::"
            else
              echo "Relatório de Lint indisponível: a falha pode ter ocorrido antes da análise."
            fi
            exit 1
          fi

      # Debug is always installable for testing, including when Release secrets are absent.
      - name: Prepare Debug APK
        id: debug_apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          OUT="Lista-de-Compras-v${VERSION}-debug.apk"
          cp "$SRC" "$OUT"
          unzip -t "$OUT" >/dev/null
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK to workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lista-de-Compras-${{ github.run_number }}-debug
          path: ${{ steps.debug_apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve signing secrets
        id: signing
        shell: bash
        env:
          KS_LISTA_COMPRAS: ${{ secrets.LISTA_COMPRAS_KEYSTORE_BASE64 }}
          STORE_LISTA_COMPRAS: ${{ secrets.LISTA_COMPRAS_KEYSTORE_PASSWORD }}
          ALIAS_LISTA_COMPRAS: ${{ secrets.LISTA_COMPRAS_KEY_ALIAS }}
          KEY_LISTA_COMPRAS: ${{ secrets.LISTA_COMPRAS_KEY_PASSWORD }}

          KS_LISTA_MERCADO: ${{ secrets.LISTA_MERCADO_KEYSTORE_BASE64 }}
          STORE_LISTA_MERCADO: ${{ secrets.LISTA_MERCADO_KEYSTORE_PASSWORD }}
          ALIAS_LISTA_MERCADO: ${{ secrets.LISTA_MERCADO_KEY_ALIAS }}
          KEY_LISTA_MERCADO: ${{ secrets.LISTA_MERCADO_KEY_PASSWORD }}

          KS_ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_ANDROID: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS_ANDROID: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ANDROID: ${{ secrets.ANDROID_KEY_PASSWORD }}

          KS_GENERIC: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_GENERIC: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_GENERIC: ${{ secrets.KEY_ALIAS }}
          KEY_GENERIC: ${{ secrets.KEY_PASSWORD }}

          KS_SIGNING: ${{ secrets.SIGNING_KEY }}
          STORE_SIGNING: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ALIAS_SIGNING: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_SIGNING: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash scripts/resolve_signing.sh

      - name: Build signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Validate signing and rename APK
        if: steps.signing.outputs.enabled == 'true'
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < VERSION)"
          VERSION_NAME="${VERSION%%+*}"
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -s "$SRC"

          OUT="Lista-de-Compras-v${VERSION_NAME}.apk"
          cp "$SRC" "$OUT"
          unzip -t "$OUT" >/dev/null

          # apksigner checks Android APK signing schemes (v2/v3), unlike jar-only checks.
          APKSIGNER="$(find "${ANDROID_HOME:?}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --min-sdk-version 26 "$OUT"

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish signed APK to GitHub Release
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Lista de Compras v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
          make_latest: true

      - name: Build result summary
        if: always()
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
          WHY: ${{ steps.signing.outputs.reason }}
          DEBUG_FILE: ${{ steps.debug_apk.outputs.file }}
        run: |
          {
            echo '### Lista de Compras: resultado do CI'
            if [[ -n "$DEBUG_FILE" ]]; then
              echo "- APK Debug: \`$DEBUG_FILE\` (aba **Artifacts** desta execução)."
            fi
            if [[ "$SIGNED" == "true" ]]; then
              echo '- Assinatura configurada: Release enviada ao GitHub Releases se as etapas posteriores passaram.'
            else
              echo "- Release assinada não gerada: Secrets ausentes ou incompletos ($WHY)."
              echo '- Para publicar Release, configure os 4 Secrets de um mesmo conjunto (ver SIGNING-SECRETS.txt).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
